name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21: zgodny z toolchainem mobilki (JDK 26 psuje build — patrz README).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Testy współdzielonej logiki (KMP commonTest na targecie Android/JVM) oraz
      # pełny build aplikacji Android — łapie zarówno regresje logiki, jak i błędy
      # kompilacji UI. iOS nie buduje się na Linuksie (wymaga macOS) i jest pomijany.
      - name: Build & test
        run: |
          chmod +x gradlew
          ./gradlew :shared:testDebugUnitTest :androidApp:testDebugUnitTest :androidApp:assembleDebug --console=plain
